[project]
name = "dcgo-rl"
version = "0.0.1"
description = "DCGO internal RL training environment (L track) — see docs/audit/internal_rl_training_environment_dev_design.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# 학습 스택은 L0 완주(M4 브리지) 시점에 활성 — 그 전까지 순수 파이프라인 코드는 stdlib+yaml만 쓴다.
train = [
    "sb3-contrib>=2.3",
    "gymnasium>=0.29",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dcgo_rl*"]
