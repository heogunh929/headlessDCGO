<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCGO 판 뷰어</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.app { display:grid; grid-template-rows:48px 1fr; height:100vh; gap:8px; padding:8px 8px 84px; }
.topbar,.panel,.footer-panel,.sheet { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.topbar { display:flex; align-items:center; gap:14px; padding:0 12px; font-size:13px; }
.topbar b { font-size:15px; } .topbar b::before { content:"◆ "; color:var(--accent); }
.main { display:grid; grid-template-columns:minmax(0,1fr) clamp(260px,26vw,340px); gap:8px; min-height:0; }
.board { min-width:0; display:grid; grid-template-rows:1fr 44px 1fr; gap:8px; overflow:auto; }
.sheet { padding:8px; display:grid; grid-template-columns:clamp(150px,20%,220px) minmax(240px,1fr) clamp(130px,16%,170px); grid-template-rows:30px minmax(0,1fr) 96px; gap:8px;
  grid-template-areas:"pname pname pname" "sec battle side" "raise battle side"; min-height:0; }
.pname { grid-area:pname; font-weight:bold; font-size:16px; display:flex; gap:12px; align-items:center; }
/* 턴 플레이어 구분(사용자 요구 2026-07-30): 진행 측 = 파란 좌측 바+옅은 배경+배지, 대기 측 = 감쇠 */
.sheet.turnside { border-left:4px solid var(--accent); background:linear-gradient(90deg, var(--accent-soft), var(--surface) 220px); }
.sheet.waitside { opacity:.72; filter:saturate(.85); }
.turnbadge { background:var(--accent); color:#fff; font-size:11.5px; font-weight:700; padding:2px 10px; border-radius:999px; }
.waitbadge { background:var(--bg); color:var(--muted); font-size:11.5px; font-weight:600; padding:2px 10px; border-radius:999px; }
.zone { border:1px solid var(--line-strong); border-radius:8px; min-height:0; overflow:auto; }
.zone h4 { margin:0; padding:3px 8px; border-bottom:1px solid var(--line); font-size:12px; background:#f8f9fb; position:sticky; top:0; color:var(--muted); }
.zone-sec { grid-area:sec; } .zone-battle { grid-area:battle; } .zone-side { grid-area:side; border:none; display:grid; grid-template-rows:1fr 1fr 1fr; gap:8px; }
.zone-raise { grid-area:raise; }
.cardlist { padding:5px; display:flex; flex-wrap:wrap; gap:4px; }
.cardchip { border:1px solid var(--line-strong); background:var(--surface); font-size:11px; padding:2px 6px; border-radius:6px; }
.battle-grid { padding:6px; display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:6px; }
.perm { border:1px dashed var(--line-strong); background:#fafbfc; font-size:11px; padding:5px; line-height:1.3; border-radius:8px; }
.perm.susp { background:var(--warn-soft); border-color:var(--warn); } .perm b { font-size:12px; }
.stack { color:#777; }
.memwrap { display:flex; align-items:center; gap:3px; padding:0 10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:auto; }
.mem { width:24px; height:24px; border:1px solid var(--line-strong); border-radius:50%; font-size:10px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; color:var(--muted); }
.mem.cur { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:bold; }
.sidebar { display:grid; grid-template-rows:minmax(0,1fr) 240px; gap:8px; min-height:0; }
.panel { display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; min-height:0; }
.panel-head { padding:6px 10px; border-bottom:1px solid #ddd; font-weight:bold; font-size:13px; display:flex; justify-content:space-between; }
.search { padding:6px; border-bottom:1px solid #ddd; } .search input { width:100%; padding:4px 6px; border:1px solid #bbb; font:inherit; }
.loglist { overflow:auto; font-size:12px; }
.logitem { padding:5px 8px; border-bottom:1px solid var(--line); cursor:pointer; white-space:pre-line; }
.logitem:hover { background:#fafbfc; } .logitem.cur { background:var(--accent-soft); border-left:3px solid var(--accent); }
.logitem small { color:var(--muted); }
.btag { display:inline-block; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; }
.btag.sec { background:var(--warn-soft); color:var(--warn); }
.btag.fld { background:var(--accent-soft); color:var(--accent); }
.chips { padding:6px; border-top:1px solid var(--line); display:flex; gap:5px; flex-wrap:wrap; }
.chip { border:1px solid var(--line-strong); padding:2px 9px; font-size:11px; cursor:pointer; background:var(--surface); border-radius:999px; } .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.jsonpanel { display:grid; grid-template-rows:auto auto minmax(0,1fr); min-height:0; }
.tabs { display:flex; gap:10px; padding:4px 10px; border-bottom:1px solid #ddd; font-size:12px; }
.tabs span { cursor:pointer; } .tabs .on { font-weight:bold; text-decoration:underline; }
pre { margin:0; padding:8px; overflow:auto; font-size:11px; background:#fcfcfc; height:100%; }
.ctl button { border:1px solid var(--line-strong); background:var(--surface); padding:5px 10px; font:inherit; cursor:pointer; border-radius:8px; }
.ctl button:hover { border-color:var(--accent); color:var(--accent); }
input[type=range] { width:100%; accent-color:var(--accent); }
/* 재생+타임라인 통합 오버레이 독 */
.playdock { position:fixed; left:50%; transform:translateX(-50%); bottom:10px; z-index:50;
  width:min(96vw, 980px); background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lift); padding:8px 12px 6px; }
.pd-row { display:flex; align-items:center; gap:10px; }
.pd-btns { display:flex; gap:4px; }
.pd-btns #play { min-width:44px; font-weight:700; }
.pd-pos { font-size:11.5px; color:var(--muted); white-space:nowrap; }
.pd-marks { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; padding:0 2px; }
.pd-gear { border:1px solid var(--line-strong); background:var(--surface); border-radius:8px; padding:5px 9px; cursor:pointer; }
.pd-opts { display:none; gap:16px; padding:6px 2px 2px; border-top:1px solid var(--line); margin-top:6px; font-size:12.5px; }
.pd-opts.open { display:flex; flex-wrap:wrap; }
.diffline { font-size:11px; padding:1px 8px; } .diffline.add { color:#070 } .diffline.del { color:#b00 }

/* ---------- 모바일(≤820px): 고정 100vh 3열 데스크톱 그리드 → 세로 흐름 스택 ---------- */
@media (max-width: 820px) {
  .app { display:block; height:auto; padding:6px; }
  .topbar { flex-wrap:wrap; padding:8px 10px; row-gap:2px; margin-bottom:8px; position:sticky; top:0; z-index:10; }
  .main { display:block; }
  .board { display:block; overflow:visible; }
  /* 시트: 3열 그리드 → 세로 스택 (이름 → 배틀 → 시큐/손패 → 육성 → 덱·트래시·게임정보 가로 3칸) */
  .sheet { display:block; margin-bottom:8px; }
  .sheet.turnside { background:linear-gradient(180deg, var(--accent-soft), var(--surface) 70px); }
  .sheet > .zone, .sheet > .zone-side { margin-top:8px; }
  .zone { max-height:180px; }
  .zone-battle .battle-grid { grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); }
  .zone-side { display:grid; grid-template-columns:auto 1fr 1fr; grid-template-rows:none; gap:8px; }
  .zone-side .zone { max-height:120px; }
  .memwrap { margin:8px 0; padding:6px 10px; justify-content:flex-start; }
  .mem { width:26px; height:26px; }
  /* 사이드바(이벤트 로그·스냅샷): 보드 아래로, 내부 스크롤 높이 제한 */
  .sidebar { display:block; margin-top:8px; }
  .panel { display:block; margin-bottom:8px; }
  .loglist { max-height:45vh; overflow:auto; }
  .jsonpanel pre { max-height:220px; height:auto; }
  /* 하단 컨트롤: 세로 스택 + 터치 타깃 확대 */
  .playdock { width:calc(100vw - 12px); bottom:6px; padding:8px 10px 6px; }
  .pd-row { flex-wrap:wrap; row-gap:6px; }
  .pd-row input[type=range] { order:5; flex-basis:100%; }
  .pd-marks { display:none; }
  .ctl button { padding:9px 14px; font-size:15px; }
  .logitem { padding:8px 10px; }
  .chip { padding:5px 12px; font-size:12px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <b>판 뷰어</b><span id="mid"></span><span id="tinfo"></span><span id="deckinfo" style="color:#777"></span>
    <span id="loadmsg" style="margin-left:auto;color:#b00"></span>
  </header>
  <div class="main">
    <div class="board">
      <div class="sheet" id="sheet2"></div>
      <div class="memwrap" id="membar"></div>
      <div class="sheet" id="sheet1"></div>
    </div>
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-head"><span>이벤트 로그</span><span>클릭 이동</span></div>
        <div class="search"><input id="q" placeholder="이벤트 검색"></div>
        <div class="loglist" id="loglist"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="panel jsonpanel">
        <div class="panel-head"><span>상태 스냅샷</span></div>
        <div class="tabs"><span data-t="sum" class="on">요약</span><span data-t="diff">Diff</span><span data-t="json">JSON</span></div>
        <pre id="statepane"></pre>
      </div>
    </aside>
  </div>
</div>
<!-- 재생+타임라인 통합 오버레이(사용자 요구 2026-07-31): 항상 화면 하단에 떠서
     진행 관찰 중 즉시 일시정지·특정 시점 이동. 옵션은 ⚙로 접힘. -->
<div class="playdock">
  <div class="pd-row">
    <div class="ctl pd-btns">
      <button onclick="go(0)">|◀</button><button onclick="go(cur-1)">◀</button>
      <button id="play" onclick="toggle()">▶</button><button onclick="go(cur+1)">▶▶</button><button onclick="go(steps.length-1)">▶|</button>
    </div>
    <input type="range" id="slider" min="0" max="0" value="0" style="flex:1">
    <span id="tpos" class="pd-pos"></span>
    <select id="speed" title="배속"><option>0.25</option><option>0.5</option><option selected>0.75</option><option>1</option><option>2</option><option>4</option></select>
    <button class="pd-gear" onclick="$('pd-opts').classList.toggle('open')" title="옵션">⚙</button>
  </div>
  <div id="marks" class="pd-marks"></div>
  <div id="pd-opts" class="pd-opts">
    <label><input type="checkbox" id="opt-hidden" checked> 숨김 정보 보기</label>
    <label><input type="checkbox" id="opt-debug"> 디버그 표시</label>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
// 아레나 모드(?arena=<matchId>): 참가자 키로 본인 판만 열람 — 운영자 토큰 불요/미요구.
const ARENA = qs.get('arena');
let TOKEN = '';
if (!ARENA) {
  TOKEN = localStorage.getItem('opsToken') || prompt('운영자 토큰');
  localStorage.setItem('opsToken', TOKEN || '');
}
let AKEY = localStorage.getItem('arenaKey') || '';
if (ARENA && !AKEY) { AKEY = prompt('아레나 API 키'); localStorage.setItem('arenaKey', AKEY || ''); }
let header = null, steps = [], events = [], frames = [], result = null, cur = 0, playing = null, tab = 'sum', chip = '전체';
let TYPES = {}, NAMES = {};   // cardNumber → cardType / 카드명 (cards.json)
const CHIPS = ['전체','phase','effect','battle','select'];

async function load() {
  try {
    if (ARENA) {
      const data = await (await fetch('/api/arena/cards', {headers: {'X-Arena-Key': AKEY}})).json();
      for (const [id, c] of Object.entries(data.cards || {})) { TYPES[id] = c.type; if (c.name) NAMES[id] = c.name; }
    } else {
      const cards = await (await fetch('/api/runner/cards', {headers: {'X-Ops-Token': TOKEN}})).json();
      for (const c of cards) { TYPES[c.cardNumber] = c.cardType; if (c.name) NAMES[c.cardNumber] = c.name; }
    }
  } catch (e) {}
  const url = ARENA ? `/api/arena/log/${ARENA}` : `/api/runner/runs/${qs.get('run')}/matches/${qs.get('match')}`;
  const r = await fetch(url, {headers: ARENA ? {'X-Arena-Key': AKEY} : {'X-Ops-Token': TOKEN}});
  if (!r.ok) { $('loadmsg').textContent = r.status === 404 ? '판 로그 준비 중이거나 없음' : '오류 ' + r.status; return; }
  const text = await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();
  for (const line of text.split('\n')) {
    if (!line.trim()) continue;
    const o = JSON.parse(line);
    if (o.type === 'header') header = o;
    else if (o.type === 'step') { steps.push(o); o._f = frames.length; frames.push(o); }
    else if (o.type === 'event') {
      events.push(o);
      if (o.state) { o._f = frames.length; frames.push(o); }          // 로그 v2: 이벤트 프레임
      // 구버전(v1, 상태 미동봉) 폴백: 다음 결정 프레임 = 그 행동의 결과가 반영된 보드.
      // 직전 프레임(-1)으로 보내면 행동 전 보드가 떠서 클릭 이동이 어긋난다(실측 2026-07-30
      // m-2016740451-11: P2 턴 이벤트 클릭 → P1 수번 보드). go()가 마지막 프레임으로 클램프.
      else o._f = frames.length;
    }
    else if (o.type === 'result') result = o;
  }
  // 배틀 분류(사용자 요구 2026-07-30): Battle 이벤트에서 역방향 스캔 — Attack/Block보다 먼저
  // Security Check를 만나면 시큐리티 배틀. 블로커 개입 시 Block이 Check보다 뒤라 필드로 갈린다.
  events.forEach((e, i) => {
    if (!/\nBattle:/.test(e.text)) return;
    for (let j = i - 1; j >= 0; j--) {
      const t = events[j].text;
      if (/Security Check:/.test(t)) { e._sec = true; break; }
      if (/\nAttack:|\nBlock:/.test(t)) break;
    }
  });
  $('mid').textContent = header.matchId + ' · ' + header.engineSha;
  // 구형(v1) 로그 감지: 이벤트에 보드 스냅샷이 없어 이벤트 단위 재생·이동이 불가 — 명시 안내.
  if (events.length && !events.some(e => e.state)) {
    $('loadmsg').textContent = '구형(v1) 로그 — 결정 단위로만 이동됩니다 (이벤트 단위 재생은 v2 기록판부터)';
    $('loadmsg').style.color = 'var(--warn)';
  }
  $('deckinfo').textContent = header.players.map(p => {
    // 아레나 덱은 JSON 전문이 실린다 — 이름만 표시(전문은 JSON 탭에서).
    try { const d = JSON.parse(p.deck); return `P${p.seat}:${d.name || '덱'}`; } catch (e) { return `P${p.seat}:${p.deck}`; }
  }).join('  ');
  $('slider').max = frames.length - 1;
  $('slider').oninput = () => go(+$('slider').value);
  const marks = [], seen = new Set();
  frames.forEach((f, i) => { const t = f.state.turn; if (!seen.has(t)) { seen.add(t); marks.push([i, t]); } });
  $('marks').innerHTML = marks.filter((_, i) => i % Math.ceil(marks.length / 10 || 1) === 0)
    .map(([i, t]) => `<span style="cursor:pointer" onclick="go(${i})">T${t}</span>`).join('') + (result ? `<span>END(${result.reason})</span>` : '');
  $('chips').innerHTML = CHIPS.map(c => `<span class="chip${c === '전체' ? ' on' : ''}" onclick="setChip('${c}',this)">${c}</span>`).join('');
  go(0);
}
function setChip(c, el) { chip = c; document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); el.classList.add('on'); renderLog(); }
$('q') && ($('q').oninput = () => renderLog());
document.querySelectorAll('.tabs span').forEach(s => s.onclick = () => {
  tab = s.dataset.t; document.querySelectorAll('.tabs span').forEach(x => x.classList.remove('on')); s.classList.add('on'); renderState();
});
$('opt-hidden').onchange = () => render(); $('opt-debug').onchange = () => render();

function toggle() {
  if (playing) { clearInterval(playing); playing = null; $('play').textContent = '▶'; return; }
  $('play').textContent = '⏸';
  playing = setInterval(() => { if (cur >= frames.length - 1) toggle(); else go(cur + 1); }, 1400 / +$('speed').value);   // 1배속=프레임당 1.4초 — 이벤트 단위 보드 변화를 읽을 시간
}
let pinned = null;   // 클릭으로 지목한 이벤트 — v1 로그의 프레임 공유 묶음에서 하이라이트가
                     // 묶음 끝으로 밀리는 문제 방지(실측 2026-07-30: Draw Phase 클릭 → Breeding 하이라이트)
function go(i, keepPin) { if (!keepPin) pinned = null; cur = Math.max(0, Math.min(frames.length - 1, i)); $('slider').value = cur; render(); }
let skipLogScroll = false;   // 로그 클릭으로 온 렌더 = 그 항목이 이미 보임 — 강제 정렬은 커서 밑을 흔든다
function goEvent(i) { pinned = events[i]; skipLogScroll = true; go(pinned._f, true); }

const nm = c => NAMES[c] ? `${c} ${NAMES[c]}` : c;   // 카드번호+카드명 (사용자 요구 2026-07-30)
function chips(cards, hide) {
  if (hide) return `<span class="cardchip">${cards.length}장 (숨김)</span>`;
  return cards.map(c => `<span class="cardchip">${nm(c)}</span>`).join('') || '<span style="color:#999;font-size:11px;padding:4px">없음</span>';
}
function permBox(p) {
  const roots = p.roots ?? (p.cards ? p.cards.filter(c => c !== p.top) : []);   // 구버전 로그 폴백
  const st = roots.length ? `<div class="stack">▽ 진화원 ${roots.map(nm).join(', ')}</div>` : '';
  const lv = p.level > 100 ? '-' : p.level, dp = p.dp < 0 ? '-' : p.dp;
  const ty = TYPES[p.top] || '';
  const stat = ty === 'Tamer' || ty === 'Option' ? `<i>${ty}</i>` : `Lv${lv} DP${dp}`;
  return `<div class="perm${p.suspended ? ' susp' : ''}"><b>${nm(p.top) ?? '?'}</b><br>${stat}${p.suspended ? ' 레스트' : ''}${st}${p.links.length ? '<div class="stack">링크 ' + p.links.map(nm).join(', ') + '</div>' : ''}</div>`;
}
function sheet(el, side, name, mySeat, activeSeat) {
  const showHidden = $('opt-hidden').checked;
  const isTurn = mySeat === activeSeat;
  el.classList.toggle('turnside', isTurn);
  el.classList.toggle('waitside', !isTurn);
  el.innerHTML = `
    <div class="pname">${name}
      ${isTurn ? '<span class="turnbadge">▶ 턴 진행 중</span>' : '<span class="waitbadge">대기</span>'}
      <small style="color:#777">덱 ${side.deckCount} · 트래시 ${side.trash.length}</small></div>
    <div class="zone zone-sec"><h4>시큐리티 (${side.security.length})</h4><div class="cardlist">${chips(side.security, !showHidden)}</div>
      <h4>손패 (${side.hand.length})</h4><div class="cardlist">${chips(side.hand, !showHidden)}</div></div>
    <div class="zone zone-battle"><h4>배틀 에어리어 (${side.field.length})</h4><div class="battle-grid">${side.field.map(permBox).join('')}</div></div>
    <div class="zone-side">
      <div class="zone"><h4>덱</h4><div style="padding:6px;font-size:13px;text-align:center">${side.deckCount}장</div></div>
      <div class="zone"><h4>트래시 (${side.trash.length})</h4><div class="cardlist">${chips(side.trash, false)}</div></div>
      <div class="zone"><h4>게임 정보</h4><div style="padding:5px;font-size:11px" id="ginfo-${mySeat}"></div></div>
    </div>
    <div class="zone zone-raise"><h4>육성 (${side.breeding.length})</h4><div class="battle-grid">${side.breeding.map(permBox).join('')}</div></div>`;
}
function render() {
  const f = frames[cur]; if (!f) return;
  const st = f.state;
  const isStep = f.type === 'step';
  const s = isStep ? f : steps.filter(x => x._f <= cur).at(-1);   // 게임 정보 박스용 최근 결정
  $('tinfo').textContent = `턴 ${st.turn} · ${st.phase} · 수번 P${st.activeSeat}`;
  sheet($('sheet1'), st.p1, 'PLAYER 1', 1, st.activeSeat); sheet($('sheet2'), st.p2, 'PLAYER 2', 2, st.activeSeat);
  let cells = '';
  for (let v = 10; v >= 1; v--) cells += `<div class="mem${st.memory === -v ? ' cur' : ''}">${v}</div>`;   // P2측(You 관점 음수)
  cells += `<div class="mem${st.memory === 0 ? ' cur' : ''}" style="width:30px;height:30px">0</div>`;
  for (let v = 1; v <= 10; v++) cells += `<div class="mem${st.memory === v ? ' cur' : ''}">${v}</div>`;
  $('membar').innerHTML = cells + `<span style="margin-left:12px;font-size:12px">메모리 ${st.memory >= 0 ? 'P1 +' + st.memory : 'P2 +' + (-st.memory)}</span>`;
  if (s) {
    const dbg = $('opt-debug').checked ? ` · tick ${s.tick} · 합법 ${s.decision.legal.length}레인 · 선택 ${s.decision.chosen}` : '';
    const gi = $('ginfo-' + s.seat); if (gi) gi.innerHTML = `<b>${s.decision.kind}</b> — P${s.seat} 결정${dbg}`;
  }
  $('tpos').textContent = isStep ? `s${f.i} 결정 (${cur + 1}/${frames.length})`
    : `${f.text.trim().split('\n')[0]} (${cur + 1}/${frames.length})`;
  renderLog(); renderState();
}
const KINDK = {MainPhase:'메인', PlayTarget:'대상', AttackTarget:'공격대상', Breeding:'육성', Selection:'선택', Optional:'선택', Command:'커맨드', Count:'수량'};
function renderLog() {
  const prevScroll = $('loglist').scrollTop;   // innerHTML 재구축 후 복원용(클릭 유지 경로)
  const q = ($('q').value || '').toLowerCase();
  const rows = [];
  let lastGap = null;
  // 타임라인 추종: 현재 프레임 이하의 마지막(필터 통과) 이벤트가 "지금" 항목 — 하이라이트+스크롤 앵커
  const shown = events.filter(e => (chip === '전체' || e.cat === chip) && (!q || e.text.toLowerCase().includes(q)));
  const pinValid = pinned && shown.includes(pinned) && Math.min(pinned._f, frames.length - 1) === cur;
  const now = pinValid ? pinned : shown.filter(e => e._f <= cur).at(-1);
  for (const e of events) {
    if (!(chip === '전체' || e.cat === chip) || (q && !e.text.toLowerCase().includes(q))) continue;
    if (e.afterStep !== lastGap) {   // 결정 경계 구분선 — "이 묶음은 s{N} 행동의 결과"임을 표시
      lastGap = e.afterStep;
      const d = steps[e.afterStep];
      const label = d ? `s${e.afterStep} · P${d.seat} ${KINDK[d.decision.kind] ?? d.decision.kind} 결정의 결과` : '판 시작';
      rows.push(`<div style="padding:3px 8px;background:#f0f0f0;font-size:11px;color:#555">── ${label} ──</div>`);
    }
    // 행위 주체 배지: AS-IS PlayLog는 본문에 좌석 이름(Player=P1 / Bot=P2)을 싣는다.
    const who = /\bPlayer\b/.test(e.text) ? '<b style="color:#06c">[P1]</b> '
             : /\bBot\b/.test(e.text) ? '<b style="color:#c60">[P2]</b> ' : '';
    // 턴 전환 구분선: 턴은 결정 없이 강제 진행되므로 결정-경계 구분선이 안 생긴다(사용자 지적
    // 2026-07-30) — AS-IS의 턴 시작 배너(Active Phase)를 경계로 삼아 굵은 줄을 끼운다.
    if (/Active Phase/.test(e.text)) {
      const seatName = /\bBot\b/.test(e.text) ? 'P2' : 'P1';
      rows.push(`<div style="padding:4px 8px;background:#ddd;font-weight:bold;font-size:12px;border-top:2px solid #999">━━ ${seatName} 턴 시작 ━━</div>`);
    }
    const battleTag = /\nBattle:/.test(e.text)
      ? (e._sec ? '<span class="btag sec">🛡 시큐리티 배틀</span> ' : '<span class="btag fld">⚔ 필드 배틀</span> ')
      : '';
    rows.push(`<div class="logitem${e === now ? ' cur' : ''}"${e === now ? ' id="logcur"' : ''} onclick="goEvent(${events.indexOf(e)})">
      <small>s${e.afterStep}→${e.afterStep + 1} · ${e.cat}</small>${who}${battleTag}${e.text.trim()}</div>`);
  }
      // 스냅샷 앵커=결정 직전 상태 — afterStep=N 이벤트의 결과는 s(N+1) 보드에 보인다
      // (사용자 발견 2026-07-30: Evolution 이벤트와 보드 불일치). 클릭=결과 시점으로 이동.
  $('loglist').innerHTML = rows.join('') || '<div style="padding:8px;color:#999">없음</div>';
  // 로그 패널 내부 스크롤만 움직인다 — scrollIntoView는 조상 스크롤(페이지)까지 끌고 가므로 금지
  // (사용자 요구 2026-07-30: 포커스가 넘어가 화면 위치를 바꾸지는 않아야 함).
  if (skipLogScroll) { skipLogScroll = false; $('loglist').scrollTop = prevScroll; return; }   // 로그 클릭 유발 렌더 — 스크롤 유지
  const el = document.getElementById('logcur');
  const box = $('loglist');
  if (el) {
    const top = el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop;
    box.scrollTop = top - box.clientHeight / 2 + el.offsetHeight / 2;
  }
  else box.scrollTop = 0;   // 첫 이벤트 이전 프레임 — 로그 맨 위로
}
function summarize(st) {
  const z = s => `덱${s.deckCount} 손${s.hand.length} 시큐${s.security.length} 트래시${s.trash.length} 필드${s.field.length}`;
  return `턴 ${st.turn} ${st.phase} (P${st.activeSeat} 차례)\n메모리 ${st.memory}\nP1: ${z(st.p1)}\nP2: ${z(st.p2)}`;
}
function diff(a, b) {
  const flat = (st, pre, out) => {
    for (const seat of ['p1', 'p2']) {
      const s = st[seat];
      out[`${seat}.덱`] = s.deckCount; out[`${seat}.손패`] = s.hand.join(' ');
      out[`${seat}.시큐리티`] = s.security.join(' '); out[`${seat}.트래시`] = s.trash.join(' ');
      out[`${seat}.필드`] = s.field.map(p => p.top + '(' + p.cards.length + ')').join(' ');
      out[`${seat}.육성`] = s.breeding.map(p => p.top).join(' ');
    }
    out['메모리'] = st.memory; out['턴'] = st.turn + ' ' + st.phase;
  };
  const A = {}, B = {}; flat(a, '', A); flat(b, '', B);
  const lines = [];
  for (const k of Object.keys(B)) if (String(A[k]) !== String(B[k]))
    lines.push(`<div class="diffline del">- ${k}: ${A[k]}</div><div class="diffline add">+ ${k}: ${B[k]}</div>`);
  return lines.join('') || '<div class="diffline">변화 없음</div>';
}
function renderState() {
  const f = frames[cur];
  if (tab === 'json') $('statepane').textContent = JSON.stringify(f, null, 2);
  else if (tab === 'sum') $('statepane').textContent = summarize(f.state);
  else $('statepane').innerHTML = cur === 0 ? '첫 프레임' : diff(frames[cur - 1].state, f.state);
}
// UI 상태 영속 — 옵션 체크박스·배속을 새로고침에도 유지(대시보드와 동일 관례)
for (const el of [$('opt-hidden'), $('opt-debug'), $('speed')]) {
  const key = 'ui:viewer:' + el.id;
  const saved = localStorage.getItem(key);
  if (saved !== null) {
    if (el.type === 'checkbox') el.checked = saved === '1';
    else el.value = saved;
  }
  el.addEventListener('change', () =>
    localStorage.setItem(key, el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value));
}
load();
</script>
