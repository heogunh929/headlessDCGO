name: CI

# Build (compile) gate for the headless engine and the RL adapter.
#
# NOTE: the former tests/ suite was discarded (2026-07-24) — its baselines were self-referential to a
# defective TO-BE engine and could not serve as an AS-IS fidelity or regression oracle. A new suite
# will be built only after the mirror is a verified 1:1 of AS-IS. Until then CI is a pure compile gate.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build (compile gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build engine
        run: dotnet build src/HeadlessDCGO.Engine/HeadlessDCGO.Engine.csproj -c Release --nologo

      - name: Build RL adapter
        run: dotnet build src/HeadlessDCGO.Rl/HeadlessDCGO.Rl.csproj -c Release --nologo
